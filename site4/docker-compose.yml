services:
  sitio4:
    image: xm6-sitio4:latest
    pull_policy: never
    restart: unless-stopped
    container_name: sitio4-xm6
    expose:
      - "80"
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.sitio4-gzip.compress=true
      - traefik.http.middlewares.sitio4-https.redirectscheme.scheme=https
      - traefik.http.routers.sitio4-http.entryPoints=http
      - traefik.http.routers.sitio4-http.middlewares=sitio4-https
      - traefik.http.routers.sitio4-http.rule=Host(`sitio4.140.84.165.65.sslip.io`) && PathPrefix(`/`)
      - traefik.http.routers.sitio4-http.service=sitio4-svc
      - traefik.http.routers.sitio4-https.entryPoints=https
      - traefik.http.routers.sitio4-https.middlewares=sitio4-gzip
      - traefik.http.routers.sitio4-https.rule=Host(`sitio4.140.84.165.65.sslip.io`) && PathPrefix(`/`)
      - traefik.http.routers.sitio4-https.service=sitio4-svc
      - traefik.http.routers.sitio4-https.tls=true
      - traefik.http.routers.sitio4-https.tls.certresolver=letsencrypt
      - traefik.http.services.sitio4-svc.loadbalancer.server.port=80
networks:
  coolify:
    name: coolify
    external: true
