server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / { try_files $uri $uri/ /index.html; }
  location ~* \.js$ { default_type application/javascript; add_header Cache-Control "no-cache"; }
  location ~* \.wasm$ { default_type application/wasm; add_header Cache-Control "no-cache"; }
  location = /health { default_type text/plain; }
}
